<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Intelligent Support Routing</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f5f7fb;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        --brand: #2457c5;
        --muted: #647087;
        --line: #e2e7ef;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; padding: 32px 18px; }
      main { width: min(680px, 100%); margin: 6vh auto; background: white; border: 1px solid var(--line); border-radius: 20px; padding: clamp(24px, 5vw, 42px); box-shadow: 0 20px 60px #25365a0c; }
      .brand { display: inline-flex; align-items: center; gap: 9px; margin-bottom: 30px; color: #384663; font-size: .9rem; font-weight: 700; }
      .brand-mark { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 11px; color: white; background: var(--brand); font-size: 1.05rem; }
      h1 { margin: 0; font-size: clamp(1.75rem, 5vw, 2.35rem); letter-spacing: -.04em; line-height: 1.15; }
      p { line-height: 1.65; color: var(--muted); }
      .intro { max-width: 52ch; margin: 12px 0 28px; }
      label { display: block; font-weight: 650; margin: 0 0 9px; }
      textarea { display: block; width: 100%; min-height: 156px; resize: vertical; border: 1px solid #cbd4e2; border-radius: 12px; padding: 14px 15px; font: inherit; line-height: 1.55; color: inherit; background: #fff; transition: border-color .15s, box-shadow .15s; }
      textarea:focus, input:focus, select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px #2457c51c; }
      textarea::placeholder { color: #8a94a7; }
      button { display: inline-flex; justify-content: center; align-items: center; min-height: 46px; margin-top: 16px; border: 0; border-radius: 10px; padding: 0 20px; font: inherit; font-weight: 650; color: white; background: var(--brand); cursor: pointer; transition: background .15s, transform .15s; }
      button:hover:not(:disabled) { background: #1948ad; }
      button:active:not(:disabled) { transform: translateY(1px); }
      button:focus-visible, a:focus-visible { outline: 3px solid #2457c555; outline-offset: 3px; }
      button:disabled { opacity: .6; cursor: wait; }
      #result { margin-top: 26px; padding: 22px; border: 1px solid var(--line); border-radius: 14px; background: #f8faff; }
      #result[hidden] { display: none; }
      #result h2 { margin: 0 0 8px; font-size: 1.3rem; letter-spacing: -.02em; }
      .note { font-size: .84rem; }
      .safety-note { margin: 24px 0 10px; padding: 12px 14px; border-radius: 10px; background: #f6f7fa; font-size: .85rem; }
      .admin-link { display: inline-block; margin-top: 8px; color: var(--brand); font-size: .88rem; font-weight: 600; text-decoration: none; }
      .admin-link:hover { text-decoration: underline; }
      .error { color: #a12622; }
      .result-label { margin: 0 0 8px; font-size: .76rem; font-weight: 750; text-transform: uppercase; letter-spacing: .08em; color: var(--brand); }
      .result-action { margin: 18px 0; padding: 15px 16px; border: 1px solid var(--line); border-left: 4px solid var(--brand); background: white; border-radius: 8px; color: #34415a; }
      #result a { color: var(--brand); font-weight: 650; }
      @media (max-width: 520px) {
        body { padding: 14px; }
        main { margin: 2vh auto; padding: 24px 20px; border-radius: 16px; }
        .brand { margin-bottom: 24px; }
        button { width: 100%; }
        #result { padding: 17px; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="brand-mark" aria-hidden="true">?</span>Support finder</div>
      <h1>Find the right support team</h1>
      <p class="intro">Tell us what happened. We’ll suggest who may be able to help and what to do next.</p>
      <form id="routing-form">
        <label for="request">What do you need help with?</label>
        <textarea id="request" maxlength="5000" required placeholder="For example: I transferred money, but the recipient has not received it."></textarea>
        <button id="submit" type="submit">Find support</button>
      </form>
      <section id="result" aria-live="polite" hidden></section>
      <p class="safety-note">Demo only: your request is not sent to a support team. Never enter your password or verification code.</p>
      <a class="admin-link" href="/admin">Staff? Manage support teams</a>
    </main>
    <script>
      const form = document.querySelector("#routing-form");
      const button = document.querySelector("#submit");
      const result = document.querySelector("#result");
      const defaultButtonText = button.textContent;

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        button.disabled = true;
        button.textContent = "Finding the right team…";
        result.hidden = true;
        result.replaceChildren();
        try {
          const response = await fetch("/api/route", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: document.querySelector("#request").value })
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || "Unable to route this request.");

          const likelyTeam = data.suggested_team;
          const label = document.createElement("p");
          label.className = "result-label";
          label.textContent = data.status === "recommended"
            ? "Suggested support team"
            : "Possible support team — please confirm";

          const heading = document.createElement("h2");
          const explanation = document.createElement("p");
          const action = document.createElement("p");
          action.className = "result-action";

          if (data.predicted_category === "account_access") {
            heading.textContent = "This sounds like a sign-in or password issue.";
            explanation.textContent = `The ${likelyTeam.name} team may be the right team to help with account access.`;
            action.textContent = likelyTeam.guidance || "Try the “Forgot password” or “Reset password” option on your organization's official sign-in page or app. If that does not work, contact the organization using a support channel listed in its official app, website, or branch, and ask for account-access help. Never share your password or a one-time verification code.";
          } else {
            heading.textContent = data.status === "recommended"
              ? `${likelyTeam.name} may be able to help.`
              : "We found a possible place to start.";
            explanation.textContent = `Based on your description, this may be a ${likelyTeam.name} issue. ${data.status === "human_review" ? "This is only a suggestion; the right team has not been confirmed." : ""}`;
            action.textContent = likelyTeam.guidance || `Contact your organization through one of its official support channels and ask for ${likelyTeam.name}. This demo has not sent your request to that team.`;
          }

          result.append(label, heading, explanation, action);
          if (likelyTeam.contact_phone) {
            const phone = document.createElement("p");
            const phoneLabel = document.createElement("strong");
            phoneLabel.textContent = "Support phone: ";
            const phoneLink = document.createElement("a");
            phoneLink.href = `tel:${likelyTeam.contact_phone.replace(/[^\d+]/g, "")}`;
            phoneLink.textContent = likelyTeam.contact_phone;
            phone.append(phoneLabel, phoneLink);
            result.append(phone);
          }
          const reminder = document.createElement("p");
          reminder.className = "note";
          reminder.textContent = data.status === "human_review"
            ? "This is a possible match, not a confirmed assignment. Please verify the contact details with your organization."
            : "This demo has not sent your request to the team. Please use the official contact details shown.";
          result.append(reminder);
          result.hidden = false;
        } catch (error) {
          const message = document.createElement("p");
          message.className = "error";
          message.textContent = error.message;
          result.append(message);
          result.hidden = false;
        } finally {
          button.disabled = false;
          button.textContent = defaultButtonText;
        }
      });
    </script>
  </body>
</html>
